      document.getElementById('btn-open-fullscreen').href = url;
      document.querySelectorAll('.screen-tab').forEach(t => {
        t.className = 'screen-tab px-4 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800 border border-transparent transition whitespace-nowrap flex items-center gap-2';
      });
      btn.className = 'screen-tab active px-4 py-2 rounded-xl text-xs font-semibold bg-cyan-500/20 text-cyan-300 border border-cyan-400/40 transition whitespace-nowrap flex items-center gap-2';
